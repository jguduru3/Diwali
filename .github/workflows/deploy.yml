name: Deploy

# push to main → dev; tag v* → prod (the "prod" environment should require approval).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write # Azure OIDC (no stored client secret)
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod') || 'dev' }}
    env:
      ENV: ${{ github.event.inputs.env || (startsWith(github.ref, 'refs/tags/v') && 'prod') || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build web and API
        run: |
          pnpm --filter web build
          pnpm --filter api build
        env:
          VITE_API_BASE: /api

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastructure (Bicep)
        id: infra
        run: |
          RG="rg-festive-$ENV"
          az group create -n "$RG" -l centralindia -o none
          az deployment group create -g "$RG" -n "festive-${{ github.run_number }}" \
            -f infra/main.bicep -p "infra/params.$ENV.json" \
            -p postgresAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}" \
               appDbPassword="${{ secrets.APP_DB_PASSWORD }}" \
               jwtSecret="${{ secrets.JWT_SECRET }}" \
               merchantSecretsKey="${{ secrets.MERCHANT_SECRETS_KEY }}" \
               msg91AuthKey="${{ secrets.MSG91_AUTH_KEY }}" \
               msg91TemplateId="${{ vars.MSG91_TEMPLATE_ID }}" \
               deployerPrincipalId="${{ secrets.AZURE_DEPLOYER_OBJECT_ID }}" \
            --query properties.outputs -o json > outputs.json
          for k in storageAccountName functionAppName keyVaultName postgresServerName frontDoorProfileName frontDoorEndpointName publicUrl; do
            echo "$k=$(jq -r ".$k.value" outputs.json)" >> "$GITHUB_OUTPUT"
          done
          echo "rg=$RG" >> "$GITHUB_OUTPUT"

      - name: Database migrations + least-privilege role
        run: |
          IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create -g "${{ steps.infra.outputs.rg }}" \
            -n "${{ steps.infra.outputs.postgresServerName }}" -r "gha-${{ github.run_id }}" \
            --start-ip-address "$IP" --end-ip-address "$IP" -o none
          trap 'az postgres flexible-server firewall-rule delete -g "${{ steps.infra.outputs.rg }}" -n "${{ steps.infra.outputs.postgresServerName }}" -r "gha-${{ github.run_id }}" --yes -o none' EXIT
          MIGRATION_URL=$(az keyvault secret show --vault-name "${{ steps.infra.outputs.keyVaultName }}" -n MIGRATION-DATABASE-URL --query value -o tsv)
          APP_PW=$(az keyvault secret show --vault-name "${{ steps.infra.outputs.keyVaultName }}" -n APP-DB-PASSWORD --query value -o tsv)
          echo "::add-mask::$MIGRATION_URL"
          echo "::add-mask::$APP_PW"
          DATABASE_URL="$MIGRATION_URL" pnpm --filter api db:migrate
          sudo apt-get install -y -qq postgresql-client > /dev/null
          PGSSLMODE=require psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -v app_password="$APP_PW" -f infra/db-roles.sql
          # Demo data only in dev (licence photos go to the private blob container).
          if [ "$ENV" = "dev" ]; then
            DATABASE_URL="$MIGRATION_URL" STORAGE_ACCOUNT_NAME="${{ steps.infra.outputs.storageAccountName }}" pnpm --filter api db:seed
          fi

      - name: Deploy API (zip)
        run: |
          cd apps/api
          mkdir -p ../../deploy
          zip -qr ../../deploy/api.zip host.json package.json dist
          cd ../..
          az functionapp deployment source config-zip -g "${{ steps.infra.outputs.rg }}" \
            -n "${{ steps.infra.outputs.functionAppName }}" --src deploy/api.zip -o none

      - name: Deploy web (static website)
        run: |
          SA="${{ steps.infra.outputs.storageAccountName }}"
          az storage blob service-properties update --account-name "$SA" --auth-mode login \
            --static-website --index-document index.html --404-document index.html -o none
          # Hashed assets: cache for a year. Everything else (index.html, sw.js, manifest): revalidate.
          az storage blob upload-batch --account-name "$SA" --auth-mode login -d '$web' -s apps/web/dist \
            --overwrite --pattern 'assets/*' --content-cache-control "public,max-age=31536000,immutable" -o none
          az storage blob upload-batch --account-name "$SA" --auth-mode login -d '$web' -s apps/web/dist \
            --overwrite --pattern '[!a]*' --content-cache-control "no-cache" -o none

      - name: Purge Front Door cache
        run: |
          az afd endpoint purge -g "${{ steps.infra.outputs.rg }}" \
            --profile-name "${{ steps.infra.outputs.frontDoorProfileName }}" \
            --endpoint-name "${{ steps.infra.outputs.frontDoorEndpointName }}" \
            --content-paths '/index.html' '/sw.js' '/manifest.webmanifest' '/' -o none

      - name: Smoke test
        run: |
          URL="${{ steps.infra.outputs.publicUrl }}"
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health"; then echo; break; fi
            echo "waiting for $URL ($i)"; sleep 20
          done
          curl -fsS "$URL/api/health"
          curl -fsS "$URL/" | grep -q "Diwali Express Pickup"
          echo "Live: $URL" >> "$GITHUB_STEP_SUMMARY"
