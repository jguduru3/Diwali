services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pataka
      POSTGRES_PASSWORD: pataka
      POSTGRES_DB: pataka
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pataka']
      interval: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'

volumes:
  pgdata:
